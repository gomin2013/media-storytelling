const STORE = 'lwp-copy-key';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct)));
}
async function show(html) {
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}
async function derive(user, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user + ':' + password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iterations, hash: 'SHA-256' }, base, 256));
}
const EN = (() => { try { return localStorage.getItem('lwp-lang') === 'en' } catch { return false } })();
const MSG = EN ? { go: 'Open', busy: 'Opening…', bad: 'Wrong username or password' } : { go: 'เข้าดู', busy: 'กำลังเปิด…', bad: 'Username หรือ password ไม่ถูกต้อง' };
const form = document.getElementById('login');
form.querySelector('button').textContent = MSG.go;
form.addEventListener('submit', async e => {
  e.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  button.textContent = MSG.busy;
  document.getElementById('error').textContent = '';
  try {
    const raw = await derive(form.user.value.trim(), form.password.value);
    const html = await decrypt(raw);
    try { sessionStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch {}
    await show(html);
  } catch {
    document.getElementById('error').textContent = MSG.bad;
    button.textContent = MSG.go;
    button.disabled = false;
  }
});
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch {}
  if (saved) { try { return await show(await decrypt(bytes(saved))); } catch { try { sessionStorage.removeItem(STORE); } catch {} } }
  form.hidden = false;
  form.user.focus();
})();
</script>
